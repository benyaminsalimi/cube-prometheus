name: publish

# Releases are cut from this repository only.
#
# Version policy: the npm version mirrors the Cube release the package is verified against
# (cubejs/cube:v1.8.25 -> cube-prometheus@1.8.25). The tag, package.json and the
# Cube release must agree, and the event-name contract must hold against that exact Cube
# tag, before anything reaches the registry.
#
# Authentication: npm trusted publishing (OIDC) is preferred — no token, no 2FA prompt,
# provenance attached automatically. Configure it once in the npm package settings
# (Trusted Publisher: benyaminsalimi/cube-prometheus, workflow publish.yml). A granular
# NPM_TOKEN with "Bypass 2FA" is used only if that secret exists.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check, pack, but do not publish or release"
        type: boolean
        default: true

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # npm 12 (latest) requires Node >= 22.22; npm 11 is the release line that added
          # trusted publishing and supports 20.17+/22.9+, so pin the runtime to 22 and the
          # CLI to 11 rather than chasing `latest` across an engine boundary.
          node-version: 22

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 still bundles npm 10.x,
      # which ignores the OIDC exchange entirely and fails with ENEEDAUTH.
      - name: npm that understands OIDC
        run: |
          npm install -g npm@11
          npm --version

      - run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Resolve the version under release
        id: version
        run: |
          set -eu
          v="$(node -p "require('./package.json').version")"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            if [ "$tag" != "$v" ]; then
              echo "::error::tag v${tag} does not match package.json version ${v}"
              exit 1
            fi
          fi
          echo "releasing ${v}"

      - name: The version must be a real Cube release
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/cubejs/cube/tags/v${v}")"
          echo "cubejs/cube:v${v} -> HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::cubejs/cube:v${v} does not exist; the package version must track a Cube release"
            exit 1
          fi

      - name: Contract against that exact Cube release
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          git clone --depth 1 --branch "v${v}" https://github.com/cube-js/cube.git /tmp/cube
          npm run contract -- --cube /tmp/cube

      - name: Pack
        run: |
          npm pack --dry-run
          npm pack
          tar -tzf "cube-prometheus-${VERSION}.tgz" | sort > /tmp/tarball.txt || true
          cat /tmp/tarball.txt 2>/dev/null || true
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Is this version already published?
        id: registry
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/cube-prometheus/${v}")"
          echo "npm ${v} -> HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "already published; publish steps will be skipped"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish via trusted publishing (OIDC)
        if: env.DRY_RUN != 'true' && env.NPM_TOKEN_SET != 'true' && steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Publish with NPM_TOKEN
        if: env.DRY_RUN != 'true' && env.NPM_TOKEN_SET == 'true' && steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          npm publish --provenance --access public

      - name: Confirm the registry has it
        if: env.DRY_RUN != 'true'
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          # npm accepts a publish before the package is readable from every edge: 25s was
          # not enough for 1.8.27, and the run then failed *after* publishing, skipping the
          # tag and release. Allow up to four minutes and report the propagation time.
          deadline=$(( $(date +%s) + 240 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS "https://registry.npmjs.org/cube-prometheus/${v}" >/dev/null 2>&1; then
              echo "cube-prometheus@${v} is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::published but the registry still does not serve ${v} after 4 minutes"
          exit 1

      - name: Verify the dist-tag and provenance
        if: env.DRY_RUN != 'true'
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          curl -fsS "https://registry.npmjs.org/cube-prometheus/${v}" > /tmp/version.json
          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("/tmp/version.json", "utf8"));
            console.log(`version=${doc.version} files=${doc.dist.fileCount} provenance=${Boolean(doc.dist.attestations)}`);
          '
          latest="$(curl -fsS https://registry.npmjs.org/cube-prometheus | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => process.stdout.write(JSON.parse(raw)["dist-tags"].latest));
          ')"
          if [ "$latest" != "$v" ]; then
            echo "::warning::dist-tag latest is ${latest}, expected ${v}"
          fi

      - name: Tag the release
        if: env.DRY_RUN != 'true'
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          if git rev-parse "v${v}" >/dev/null 2>&1; then
            echo "tag v${v} already exists"
          else
            git tag "v${v}"
            git push origin "v${v}"
          fi

      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          awk -v ver="## [${v}]" '
            index($0, ver) { printing = 1 }
            printing && index($0, "## [") && !index($0, ver) { exit }
            printing { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "v${v}" \
            --title "v${v} — tracks cubejs/cube:v${v}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
