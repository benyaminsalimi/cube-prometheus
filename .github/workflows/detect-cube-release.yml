name: detect cube release

# Finds a newer Cube release than the package version and opens a release pull request.
# Nothing is published here: the PR must pass CI, the umbrella repository must pass its
# end-to-end and Grafana checks on the bumped submodule, and only then is a tag pushed.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required to dispatch publish.yml after merging: `gh workflow run` is an Actions API
  # call, and without this the merge succeeds and the release silently never publishes.
  actions: write

concurrency:
  group: detect-cube-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      # A PAT here means the branch push triggers normal CI on the pull request.
      # With the default token, GitHub suppresses those runs, which is why the gates
      # below are executed in this job as well.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Compare with the latest Cube release
        id: compare
        run: |
          set -eu
          latest="$(curl -fsS 'https://hub.docker.com/v2/repositories/cubejs/cube/tags?page_size=100&ordering=last_updated' \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const tags = JSON.parse(raw).results
                  .map((result) => result.name)
                  .filter((name) => /^v\d+\.\d+\.\d+$/.test(name))
                  .map((name) => name.slice(1));
                tags.sort((a, b) => {
                  const pa = a.split(".").map(Number);
                  const pb = b.split(".").map(Number);
                  return pb[0] - pa[0] || pb[1] - pa[1] || pb[2] - pa[2];
                });
                process.stdout.write(tags[0] || "");
              });
            ')"

          current="$(node -p "require('./package.json').version")"
          echo "latest=${latest} current=${current}"

          if [ -z "$latest" ]; then
            echo "::error::could not determine the latest Cube release"
            exit 1
          fi

          newer="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
          if [ "$newer" = "$current" ]; then
            echo "already on the newest Cube release"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      - name: The merged version is actually published
        id: registry
        run: |
          set -eu
          v="$(node -p "require('./package.json').version")"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/cube-prometheus/${v}")"
          echo "npm cube-prometheus@${v} -> HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::main is at ${v} but the registry does not serve it"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # A release can merge and then fail to publish (a permissions error in the dispatch,
      # a transient npm failure). Nothing else notices: the next day's run sees the version
      # already matching the newest Cube release and reports success. So reconcile here.
      - name: Recover a stranded release
        if: steps.registry.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${{ vars.AUTO_PUBLISH }}" = "true" ]; then
            echo "re-dispatching publish.yml for the unpublished version"
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
            exit 0
          fi
          echo "::error::AUTO_PUBLISH is not true; publish the missing version manually"
          exit 1

      - name: Bump the version
        if: steps.compare.outputs.update == 'true'
        env:
          VERSION: ${{ steps.compare.outputs.version }}
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`package.json -> ${version}`);
          '
          npm install --package-lock-only --no-audit --no-fund
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const path = "CHANGELOG.md";
            const text = fs.readFileSync(path, "utf8");
            if (text.includes(`## [${version}]`)) process.exit(0);
            const entry = `## [${version}] — ${new Date().toISOString().slice(0, 10)}\n\n- Tracks Cube v${version}.\n\n`;
            fs.writeFileSync(path, text.replace("## [", `${entry}## [`));
          '

      - name: Verify the candidate before opening a pull request
        if: steps.compare.outputs.update == 'true'
        env:
          VERSION: ${{ steps.compare.outputs.version }}
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npm test
          git clone --depth 1 --branch "v${VERSION}" https://github.com/cube-js/cube.git /tmp/cube
          npm run contract -- --cube /tmp/cube
          npm pack --dry-run

      - name: Open or update the release pull request
        if: steps.compare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.compare.outputs.version }}
        run: |
          set -eu
          branch="release/cube-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: ${VERSION}, tracking cubejs/cube:v${VERSION}"
          # The branch is owned by this workflow and rebuilt from main on every run, so a
          # lease would fail whenever a previous run left it behind.
          git push --force origin "$branch"

          cat > /tmp/pr.md <<EOF
          Tracks \`cubejs/cube:v${VERSION}\`.

          Verified in the workflow run that opened this pull request:

          - unit tests
          - the event-name contract against \`cubejs/cube:v${VERSION}\`
          - \`npm pack --dry-run\`

          Before tagging, the umbrella repository must also be green after the submodule
          bump: end-to-end against a real Cube and Postgres, plus every dashboard panel
          queried through Grafana.

          Note: pull requests opened with the default \`GITHUB_TOKEN\` do not trigger CI.
          Add a \`RELEASE_TOKEN\` secret (a PAT with \`repo\` scope) to make this branch behave
          like any other.
          EOF

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file /tmp/pr.md
            echo "updated pull request for ${branch}"
          else
            gh pr create --base main --head "$branch" \
              --title "release: ${VERSION}" --body-file /tmp/pr.md
            echo "opened pull request for ${branch}"
          fi

      - name: Merge the verified candidate
        if: steps.compare.outputs.update == 'true' && vars.AUTO_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.compare.outputs.version }}
        run: |
          set -eu
          branch="release/cube-${VERSION}"

          # Only ever auto-merge the mechanical bump. If the branch carries anything else,
          # a human looks at it instead.
          git fetch --quiet origin main
          changed="$(git diff --name-only "origin/main...HEAD" | sort)"
          echo "changed files:"$'\n'"${changed}"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^(package\.json|package-lock\.json|CHANGELOG\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::refusing to auto-merge: unexpected files in the release branch"
            echo "$unexpected"
            exit 1
          fi

          gh pr merge "$branch" --squash --delete-branch
          echo "merged ${branch}"

      - name: Dispatch the publish workflow
        if: steps.compare.outputs.update == 'true' && vars.AUTO_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # A tag pushed with the default GITHUB_TOKEN does not trigger a workflow run, so
          # the release is dispatched explicitly. publish.yml creates the tag and the
          # GitHub release once the registry serves the version.
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          echo "publish dispatched"

      - name: Note when auto-release is disabled
        if: steps.compare.outputs.update == 'true' && vars.AUTO_RELEASE == 'false'
        run: echo "AUTO_RELEASE is false — pull request left open for review"

